    <script>
      /* Fix for "Cannot set property fetch of #<Window> which has only a getter" */
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var _fetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // pass
        }
      })();
    </script>
